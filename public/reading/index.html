<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经济学阅读与标记</title><style>
:root{--green:#245d47;--paper:#f7f5ed;--line:#deded2;--ink:#26382e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui,sans-serif}button,select,input,textarea{font:inherit}button,a,summary{cursor:pointer}button{border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:white;color:var(--green)}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #72a98a;outline-offset:2px}header{position:sticky;top:0;background:#f7f5edf2;border-bottom:1px solid var(--line);padding:12px 20px;z-index:3;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header a{color:var(--green);text-decoration:none}header strong{margin-right:auto}.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 280px;max-width:1600px;margin:auto}nav,.notes-panel{position:sticky;top:74px;height:calc(100vh - 74px);overflow:auto;padding:20px;border-right:1px solid var(--line)}nav ol{padding:0;list-style:none}nav button{display:block;width:100%;text-align:left;margin:5px 0;font-size:13px}nav button.current{background:var(--green);color:white}nav input{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}.reader{max-width:850px;width:100%;margin:auto;padding:35px 40px 100px}.reader h1{font:600 32px/1.35 Georgia,serif}.reader h2{font-size:24px;margin-top:40px}.reader h3{font-size:20px;margin-top:28px}.reader p,.reader li{font:18px/1.9 Georgia,serif;overflow-wrap:anywhere}.reader table{border-collapse:collapse;display:block;max-width:100%;overflow:auto}.reader td{padding:10px;border:1px solid var(--line)}.reader figure{margin:24px 0}.reader img{max-width:100%;height:auto}.reader aside{padding:15px;border-left:3px solid #90b29a;background:#edf1e7}.reader mark{background:#ffed8b;color:inherit}.reader [data-pid]{scroll-margin-top:110px}.reader [data-pid].bookmarked{border-left:3px solid var(--green);padding-left:12px}.muted{color:#708072;font-size:13px}.notes-panel{border-right:0;border-left:1px solid var(--line)}.saved-note{background:white;border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:12px;font-size:13px}.saved-note blockquote{margin:6px 0;padding-left:10px;border-left:3px solid #f0d453}.saved-note button{font-size:12px;padding:4px 8px}.selection-tools{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;padding:10px;box-shadow:0 8px 35px #193c3233;border:1px solid var(--line);border-radius:12px;z-index:10;display:flex;gap:7px;white-space:nowrap}[hidden]{display:none!important}.toast{position:fixed;top:85px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 18px;border-radius:9px;z-index:20}.page-controls{display:flex;justify-content:space-between;gap:10px;margin:35px 0}.source{border-top:1px solid var(--line);padding-top:18px}.source a{color:var(--green)}dialog{border:1px solid var(--line);border-radius:14px;padding:24px;max-width:500px;width:90%}dialog::backdrop{background:#193b3266}dialog textarea{width:100%;min-height:110px;padding:10px;margin:10px 0}dialog menu{padding:0;display:flex;justify-content:flex-end;gap:8px}.mobile-toggle{display:none}progress{accent-color:var(--green);width:100%}@media(max-width:1150px){.layout{grid-template-columns:230px minmax(0,1fr)}.notes-panel{position:static;height:auto;grid-column:1/-1;border-top:1px solid var(--line);display:none}.notes-panel.show{display:block}}@media(max-width:700px){header{padding:10px;font-size:13px}.layout{display:block}nav{display:none;position:static;height:auto;max-height:60vh;border-bottom:1px solid var(--line)}nav.show{display:block}.mobile-toggle{display:inline-block}.reader{padding:24px 20px 90px}.reader p,.reader li{font-size:17px}.selection-tools{bottom:10px;max-width:98%;flex-wrap:wrap}.reader h1{font-size:27px}}

.reader{overflow-x:clip}.reader math{display:inline-block;max-width:100%;overflow-x:auto;vertical-align:middle}.ipa-word{max-width:100%;overflow-wrap:anywhere}
.bilingual-controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);font-size:13px;background:#edf2e9}.bilingual-controls label{display:flex;gap:6px;align-items:center}.bilingual-controls span{color:#60776b}.zh-translation{font:16px/1.9 system-ui,"Microsoft YaHei",sans-serif;color:#355c47;background:#edf3e9;padding:12px 16px;border-left:3px solid #91b298;border-radius:0 7px 7px 0;margin:6px 0 24px}.hide-translation .zh-translation{display:none}.ipa-word{display:inline-block;position:relative;padding-top:.65em}.ipa-word::before{content:attr(data-ipa);position:absolute;top:-.42em;left:50%;transform:translateX(-50%);font:11px/1.2 system-ui,sans-serif;white-space:nowrap;color:#7b6387;pointer-events:none;user-select:none}.hide-ipa .ipa-word{padding-top:0}.hide-ipa .ipa-word::before{display:none}.reading-bilingual-note{font-size:12px;color:#708072;margin:0 0 24px}body:not(.hide-ipa) #text [data-pid]:not(.zh-translation){line-height:2.4}
</style></head><body>
<header><a href="../#knowledge">← 知识库</a><strong id="bookTitle">载入书籍…</strong><button class="mobile-toggle" id="tocToggle">目录</button><button id="notesToggle">我的标记</button><button id="bookmark">书签</button><button id="export">导出标记</button><button id="import">导入</button><input type="file" id="importFile" accept="application/json" hidden></header>
<div class="bilingual-controls"><label><input type="checkbox" id="showTranslation" checked>显示中文译文</label><label><input type="checkbox" id="showIpa" checked>生词音标</label><span id="translationStatus">中英逐段对照 · 美式音标</span></div><div class="layout"><nav id="toc" aria-label="章节目录"><h2>阅读目录</h2><p class="muted">英文全文 · 中文阅读操作</p><input id="tocSearch" aria-label="搜索目录" placeholder="搜索章节标题"><ol id="chapters"></ol><progress id="progress" max="100" value="0"></progress><p class="muted" id="progressText"></p></nav><main class="reader"><h1 id="chapterTitle"></h1><p class="muted" id="readingHint">选中一段中的文字，即可高亮或批注。双击高亮可查看批注。</p><article id="text"></article><div class="page-controls"><button id="previous">← 上一章</button><button id="next">下一章 →</button></div><aside class="source" id="source"></aside></main><aside class="notes-panel" id="notesPanel"><h2>我的标记</h2><p class="muted">标记自动保存在当前浏览器。导出可备份或迁移。</p><div id="savedNotes"></div></aside></div>
<div class="selection-tools" id="selectionTools" hidden><button id="highlight">🟨 高亮</button><button id="annotate">✎ 批注</button><button id="selectionBookmark">🔖 段落书签</button><button id="cancelSelection" aria-label="取消选择">×</button></div><div class="toast" id="toast" hidden role="status"></div>
<dialog id="noteDialog"><form method="dialog" id="noteForm"><h2>添加批注</h2><blockquote id="quotePreview"></blockquote><label for="noteInput">你的想法</label><textarea id="noteInput" maxlength="3000"></textarea><menu><button value="cancel">取消</button><button value="save">保存批注</button></menu></form></dialog>
<script>
const $=s=>document.querySelector(s);const bookId=new URLSearchParams(location.search).get('book')==='economics'?'economics':'wealth';const key='economics-reader-v1-'+bookId;let book,chapter=0,selectionData=null,timer,captureTimer,scrollTimer,loaded=false,pronunciations={};let saved={version:1,book:bookId,chapter:0,paragraph:null,marks:[],bookmarks:[]};try{const data=JSON.parse(localStorage.getItem(key));if(data&&Array.isArray(data.marks)&&Array.isArray(data.bookmarks))saved={...saved,...data}}catch{}
function notify(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,2400)}
function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch{notify('保存失败：请导出标记备份，检查浏览器存储空间。')}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let navigationId=0;async function getLanguageData(item,index){try{const response=await fetch('./'+bookId+'-zh-'+index+'.json');if(response.ok)item.translations=(await response.json()).paragraphs;else item.translations=null}catch{item.translations=null}}
async function go(n,paragraph=null){const request=++navigationId;chapter=Math.max(0,Math.min(book.chapters.length-1,n));saved.chapter=chapter;saved.paragraph=paragraph;persist();history.replaceState(null,'','#chapter-'+(chapter+1));const item=book.chapters[chapter];if(!item.html&&item.file){loaded=false;$('#chapterTitle').textContent=item.title;$('#text').textContent='正在载入本章正文与插图…';try{const response=await fetch('./'+item.file);if(!response.ok)throw Error('HTTP '+response.status);item.html=(await response.json()).html}catch(error){if(request===navigationId)$('#text').textContent='本章加载失败，请点击目录重试。'+error.message;return}}await getLanguageData(item,chapter);if(request!==navigationId)return;render();$('#toc').classList.remove('show');if(paragraph)document.querySelector('[data-pid="'+paragraph+'"]')?.scrollIntoView({block:'center'});else window.scrollTo(0,0);}

function annotateWords(el){const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let node;while(node=walker.nextNode()){if(!node.parentElement.closest('math,svg,.ipa-word'))nodes.push(node)}for(const node of nodes){const text=node.textContent,regex=/[A-Za-z]+(?:'[A-Za-z]+)?/g;let match,cursor=0,fragment=document.createDocumentFragment(),hasMatch=false;while(match=regex.exec(text)){const ipa=pronunciations[match[0].toLowerCase()];if(!ipa)continue;hasMatch=true;fragment.append(document.createTextNode(text.slice(cursor,match.index)));const span=document.createElement('span');span.className='ipa-word';span.dataset.ipa=ipa;span.textContent=match[0];span.title=match[0]+' '+ipa;fragment.append(span);cursor=match.index+match[0].length}if(hasMatch){fragment.append(document.createTextNode(text.slice(cursor)));node.replaceWith(fragment)}}}
function decorateBilingual(){const item=book.chapters[chapter];const translations=item.translations||{};const paragraphs=[...$('#text').querySelectorAll('[data-pid]')];let ready=0;for(const block of paragraphs){const id=block.dataset.pid,entry=translations[id];let target=block;if(block.tagName==='LI'||block.tagName==='TD'){target=document.createElement('div');target.dataset.pid=id;target.tabIndex=0;target.className=block.classList.contains('bookmarked')?'original-block bookmarked':'original-block';while(block.firstChild)target.append(block.firstChild);block.append(target);block.removeAttribute('data-pid')}annotateWords(target);if(entry?.zh&&entry.original===target.textContent){const translation=document.createElement('div');translation.className='zh-translation';translation.dataset.translationFor=id;translation.lang='zh-CN';translation.dataset.pid='zh-'+id;translation.tabIndex=0;translation.textContent=entry.zh.replace(/▁/g,' ').trim();target.after(translation);ready++}}$('#translationStatus').textContent=ready?('本章 '+ready+' 段中文译文 · 机器译文 · 美式音标'):('本章中文译文正在准备 · 美式音标已就绪');$('#showTranslation').checked=saved.showTranslation!==false;$('#showIpa').checked=saved.showIpa!==false;document.body.classList.toggle('hide-translation',saved.showTranslation===false);document.body.classList.toggle('hide-ipa',saved.showIpa===false)}
$('#showTranslation').onchange=e=>{saved.showTranslation=e.target.checked;document.body.classList.toggle('hide-translation',!saved.showTranslation);persist()};$('#showIpa').onchange=e=>{saved.showIpa=e.target.checked;document.body.classList.toggle('hide-ipa',!saved.showIpa);persist()};

function applyMarks(){const marks=saved.marks.filter(m=>m.chapter===chapter);for(const m of marks){const el=document.querySelector('[data-pid="'+m.paragraph+'"]');if(!el)continue;const content=el.textContent;if(content.slice(m.start,m.end)!==m.quote){const relocated=content.indexOf(m.quote);if(relocated<0)continue;m.start=relocated;m.end=relocated+m.quote.length}const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let node,pos=0,pieces=[];while(node=walker.nextNode()){const len=node.textContent.length;if(pos<m.end&&pos+len>m.start)pieces.push({node,start:Math.max(0,m.start-pos),end:Math.min(len,m.end-pos)});pos+=len}for(const p of pieces.reverse()){if(p.node.parentElement.closest('mark'))continue;const range=document.createRange();range.setStart(p.node,p.start);range.setEnd(p.node,p.end);const mark=document.createElement('mark');mark.dataset.mark=m.id;mark.title=m.note||'已高亮';range.surroundContents(mark)}}}
function render(){loaded=false;$('#chapterTitle').textContent=book.chapters[chapter].title;$('#text').innerHTML=book.chapters[chapter].html;let blocks=[...$('#text').querySelectorAll('p,li,td,h2,h3')].filter(el=>!el.parentElement.closest('p,li,td,h2,h3'));blocks.forEach((el,i)=>{el.dataset.pid='p'+i;el.tabIndex=0});[...$('#text').querySelectorAll('figcaption')].forEach((el,i)=>{el.dataset.pid='c'+i;el.tabIndex=0});decorateBilingual();applyMarks();saved.bookmarks.filter(b=>b.chapter===chapter).forEach(b=>document.querySelector('[data-pid="'+b.paragraph+'"]')?.classList.add('bookmarked'));$('#previous').disabled=chapter===0;$('#next').disabled=chapter===book.chapters.length-1;$('#progress').value=(chapter+1)/book.chapters.length*100;$('#progressText').textContent='第 '+(chapter+1)+' / '+book.chapters.length+' 章';renderToc();renderNotes();$('#selectionTools').hidden=true;selectionData=null;setTimeout(()=>loaded=true,500)}
function renderToc(){const query=$('#tocSearch').value.toLowerCase();$('#chapters').innerHTML=book.chapters.map((c,i)=>({c,i})).filter(({c})=>c.title.toLowerCase().includes(query)).map(({c,i})=>'<li><button data-chapter="'+i+'" class="'+(i===chapter?'current':'')+'">'+(i+1)+'. '+esc(c.title)+'</button></li>').join('')}
function renderNotes(){const items=[...saved.marks.map(m=>({...m,type:'mark'})),...saved.bookmarks.map(m=>({...m,type:'bookmark'}))];$('#savedNotes').innerHTML=items.length?items.map(m=>'<section class="saved-note"><strong>'+esc(book.chapters[m.chapter]?.title||'')+'</strong><blockquote>'+esc(m.quote)+'</blockquote><p>'+esc(m.note|| (m.type==='bookmark'?'段落书签':'高亮标记'))+'</p><button data-jump="'+m.id+'" data-type="'+m.type+'">定位</button> <button data-remove="'+m.id+'" data-type="'+m.type+'">删除</button></section>').join(''):'<p class="muted">暂时没有标记。选中文字后点击高亮或批注，也可以保存段落书签。</p>'}
function capture(){const sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;const range=sel.getRangeAt(0),a=(range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement).closest('[data-pid]'),b=(range.endContainer.nodeType===1?range.endContainer:range.endContainer.parentElement).closest('[data-pid]');if(!a||!$('#text').contains(a))return;if(a!==b){notify('请在同一段内选取文字；长批注可分段保存。');return}const before=document.createRange();before.selectNodeContents(a);before.setEnd(range.startContainer,range.startOffset);const start=before.toString().length;selectionData={chapter,paragraph:a.dataset.pid,start,end:start+range.toString().length,quote:range.toString()};$('#selectionTools').hidden=false}
function saveMark(note=''){if(!selectionData)return;const m={...selectionData,note,id:crypto.randomUUID()};const overlap=saved.marks.some(x=>x.chapter===m.chapter&&x.paragraph===m.paragraph&&x.start<m.end&&x.end>m.start);if(overlap){notify('这段文字已有标记，请从“我的标记”管理。');return}saved.marks.push(m);persist();window.getSelection()?.removeAllRanges();applyMarks();renderNotes();$('#selectionTools').hidden=true;notify('标记已保存')}
function addBookmark(data){let el=document.querySelector('[data-pid="'+saved.paragraph+'"]')||$('#text [data-pid]');if(!data&&el)data={chapter,paragraph:el.dataset.pid,quote:el.textContent.slice(0,140)};if(!data)return;const exists=saved.bookmarks.some(b=>b.chapter===chapter&&b.paragraph===data.paragraph);if(exists){notify('该段落已设书签');return}saved.bookmarks.push({...data,id:crypto.randomUUID()});persist();renderNotes();document.querySelector('[data-pid="'+data.paragraph+'"]')?.classList.add('bookmarked');$('#selectionTools').hidden=true;notify('书签已保存')}
$('#tocSearch').addEventListener('input',renderToc);$('#chapters').addEventListener('click',e=>{const button=e.target.closest('[data-chapter]');if(button)go(Number(button.dataset.chapter))});$('#previous').onclick=()=>go(chapter-1);$('#next').onclick=()=>go(chapter+1);$('#tocToggle').onclick=()=>$('#toc').classList.toggle('show');$('#notesToggle').onclick=()=>$('#notesPanel').classList.toggle('show');$('#highlight').onclick=()=>saveMark();$('#annotate').onclick=()=>{if(!selectionData)return;$('#quotePreview').textContent=selectionData.quote;$('#noteInput').value='';$('#noteDialog').returnValue='cancel';$('#noteDialog').showModal()};$('#noteDialog').addEventListener('close',()=>{if($('#noteDialog').returnValue==='save')saveMark($('#noteInput').value.trim())});$('#bookmark').onclick=()=>addBookmark();$('#selectionBookmark').onclick=()=>addBookmark(selectionData);$('#cancelSelection').onclick=()=>{$('#selectionTools').hidden=true;window.getSelection()?.removeAllRanges()};$('#text').addEventListener('mouseup',()=>setTimeout(capture,0));$('#text').addEventListener('touchend',()=>setTimeout(capture,120));document.addEventListener('selectionchange',()=>{clearTimeout(captureTimer);if(!window.getSelection()?.isCollapsed)captureTimer=setTimeout(capture,200)});
$('#text').addEventListener('dblclick',e=>{const mark=e.target.closest('mark');if(mark){const m=saved.marks.find(x=>x.id===mark.dataset.mark);if(m){notify(m.note||'高亮标记；可在“我的标记”定位或删除');$('#notesPanel').classList.add('show')}}});
$('#savedNotes').addEventListener('click',e=>{const jump=e.target.closest('[data-jump]'),remove=e.target.closest('[data-remove]');const button=jump||remove;if(!button)return;const items=button.dataset.type==='mark'?saved.marks:saved.bookmarks;const entry=items.find(m=>m.id===(button.dataset.jump||button.dataset.remove));if(!entry)return;if(jump)go(entry.chapter,entry.paragraph);else if(confirm('删除这条标记？')){if(button.dataset.type==='mark')saved.marks=saved.marks.filter(m=>m.id!==entry.id);else saved.bookmarks=saved.bookmarks.filter(m=>m.id!==entry.id);persist();render()}});
window.addEventListener('scroll',()=>{if(!loaded)return;clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{const blocks=[...$('#text').querySelectorAll('[data-pid]')];const visible=blocks.find(el=>el.getBoundingClientRect().bottom>100);if(visible){saved.chapter=chapter;saved.paragraph=visible.dataset.pid;persist()}},400)},{passive:true});
$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='读书标记-'+bookId+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());const valid=data.version===1&&data.book===bookId&&Array.isArray(data.marks)&&Array.isArray(data.bookmarks)&&[...data.marks,...data.bookmarks].every(m=>Number.isInteger(m.chapter)&&m.chapter>=0&&m.chapter<book.chapters.length&&/^(?:zh-)?[pc]\d+$/.test(m.paragraph)&&typeof m.id==='string'&&/^[a-zA-Z0-9-]{1,80}$/.test(m.id)&&typeof m.quote==='string'&&m.quote.length<=200000&&(m.note===undefined||(typeof m.note==='string'&&m.note.length<=3000))&&(m.start===undefined||(Number.isInteger(m.start)&&Number.isInteger(m.end)&&m.start>=0&&m.end>m.start)));if(!valid)throw Error();if(!confirm('用备份替换本书当前标记？'))return;saved={...saved,...data};go(saved.chapter,saved.paragraph);notify('标记已导入')}catch{notify('备份无效，或属于另一本书。')}e.target.value=''};
fetch('./pronunciations.json').then(r=>r.ok?r.json():{}).then(data=>{pronunciations=data.words||{};return fetch('./'+bookId+'.json')}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{book=data;$('#bookTitle').textContent=book.title;document.title=book.title+' · 阅读与标记';$('#source').innerHTML='<strong>'+esc(book.author)+'</strong><p>'+esc(book.subtitle)+'</p><p>'+esc(book.license).replace('正文未翻译。','正文保留英文，另附中文助读译文。')+'</p><a href="'+book.source+'" target="_blank" rel="noopener">原始来源及许可</a>'+(bookId==='wealth'?' · <a href="wealth-source.txt" download>下载原始文本与许可证</a>':' · <a href="OPENSTAX-LICENSE.txt">许可证</a>');const explicit=location.hash.match(/^#chapter-(\d+)$/);const target=explicit?Number(explicit[1])-1:saved.chapter;go(target,target===saved.chapter?saved.paragraph:null)}).catch(error=>{$('#bookTitle').textContent='书籍加载失败';$('#chapterTitle').textContent='暂时无法加载正文';$('#text').textContent='请刷新页面重试。'+error.message});
</script></body></html>
