<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 词汇训练</title><style>body{font:16px system-ui,-apple-system,sans-serif;max-width:850px;margin:auto;padding:18px;background:#f7f9f7;color:#203129}header{position:sticky;top:0;background:#f7f9f7;padding:12px 0;border-bottom:1px solid #ddd}h1{font-size:23px;margin:0}p{color:#57665c}article{background:white;border:1px solid #e2e8e2;border-radius:12px;margin:12px 0;padding:16px}strong{font-size:21px}small{color:#637269}button{padding:10px;border:1px solid #b6c9bc;border-radius:9px;background:white;margin:5px 5px 0 0;font-size:14px;cursor:pointer}button[aria-pressed=true]{background:#206748;color:white} .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#stats{font-weight:700;color:#245d43} .note{font-size:13px}</style><header><h1>TOEIC 高频词 · 第一天</h1><p id="stats">载入中</p><p class="note">点 🔊 听发音；选择熟悉度会保存在当前浏览器。尚未接入云端同步。</p></header><main id="list"></main><script>const words=[["agenda","议程","əˈdʒendə"],["applicant","申请人","ˈæplɪkənt"],["appointment","预约；任命","əˈpɔɪntmənt"],["approve","批准","əˈpruːv"],["approximately","大约","əˈprɑːksɪmətli"],["arrange","安排","əˈreɪndʒ"],["attendance","出席","əˈtendəns"],["available","可用的","əˈveɪləbəl"],["benefit","福利；好处","ˈbenɪfɪt"],["budget","预算","ˈbʌdʒɪt"],["candidate","候选人","ˈkændɪdeɪt"],["capacity","容量；能力","kəˈpæsəti"],["client","客户","ˈklaɪənt"],["colleague","同事","ˈkɑːliːɡ"],["confirm","确认","kənˈfɜːrm"],["consistently","持续一致地","kənˈsɪstəntli"],["contract","合同","ˈkɑːntrækt"],["convenient","方便的","kənˈviːniənt"],["deadline","截止日期","ˈdedlaɪn"],["deliver","递送","dɪˈlɪvər"],["department","部门","dɪˈpɑːrtmənt"],["discount","折扣","ˈdɪskaʊnt"],["distribute","分发","dɪˈstrɪbjuːt"],["efficient","高效的","ɪˈfɪʃənt"],["eligible","符合条件的","ˈelɪdʒəbəl"],["employee","员工","ɪmˈplɔɪiː"],["employer","雇主","ɪmˈplɔɪər"],["enclose","随信附上","ɪnˈkloʊz"],["equipment","设备","ɪˈkwɪpmənt"],["estimate","估计","ˈestɪmət"],["evaluate","评估","ɪˈvæljueɪt"],["expense","费用","ɪkˈspens"],["facility","设施","fəˈsɪləti"],["feedback","反馈","ˈfiːdbæk"],["frequently","频繁地","ˈfriːkwəntli"],["guarantee","保证","ˌɡærənˈtiː"],["implement","实施","ˈɪmplɪment"],["improve","改善","ɪmˈpruːv"],["increase","增加","ɪnˈkriːs"],["inquiry","询问","ɪnˈkwaɪəri"],["inspection","检查","ɪnˈspekʃən"],["install","安装","ɪnˈstɔːl"],["insurance","保险","ɪnˈʃʊrəns"],["inventory","库存","ˈɪnvəntɔːri"],["invoice","发票","ˈɪnvɔɪs"],["launch","推出","lɔːntʃ"],["maintenance","维护","ˈmeɪntənəns"],["management","管理层","ˈmænɪdʒmənt"],["manufacturer","制造商","ˌmænjuˈfæktʃərər"],["merchandise","商品","ˈmɜːrtʃəndaɪs"],["negotiate","谈判","nɪˈɡoʊʃieɪt"],["notify","通知","ˈnoʊtɪfaɪ"],["obtain","获得","əbˈteɪn"],["operate","操作；经营","ˈɑːpəreɪt"],["opportunity","机会","ˌɑːpərˈtuːnəti"],["outstanding","杰出的；未结清的","aʊtˈstændɪŋ"],["participate","参加","pɑːrˈtɪsɪpeɪt"],["performance","表现；性能","pərˈfɔːrməns"],["permit","许可证；允许","ˈpɜːrmɪt"],["personnel","人员","ˌpɜːrsəˈnel"],["postpone","推迟","poʊstˈpoʊn"],["procedure","程序","prəˈsiːdʒər"],["process","流程","ˈprɑːses"],["productivity","生产率","ˌproʊdʌkˈtɪvəti"],["proposal","提案","prəˈpoʊzəl"],["purchase","购买","ˈpɜːrtʃəs"],["qualification","资格","ˌkwɑːlɪfɪˈkeɪʃən"],["quotation","报价","kwoʊˈteɪʃən"],["receipt","收据","rɪˈsiːt"],["recruit","招聘","rɪˈkruːt"],["refund","退款","ˈriːfʌnd"],["regarding","关于","rɪˈɡɑːrdɪŋ"],["reimburse","报销","ˌriːɪmˈbɜːrs"],["reliable","可靠的","rɪˈlaɪəbəl"],["renovation","翻新","ˌrenəˈveɪʃən"],["representative","代表","ˌreprɪˈzentətɪv"],["requirement","要求","rɪˈkwaɪərmənt"],["reservation","预订","ˌrezərˈveɪʃən"],["reschedule","重新安排时间","ˌriːˈskedʒuːl"],["responsibility","责任","rɪˌspɑːnsəˈbɪləti"],["revenue","收入","ˈrevənuː"],["schedule","日程","ˈskedʒuːl"],["shipment","货运批次","ˈʃɪpmənt"],["significant","显著的","sɪɡˈnɪfɪkənt"],["specification","规格","ˌspesɪfɪˈkeɪʃən"],["submit","提交","səbˈmɪt"],["supplier","供应商","səˈplaɪər"],["survey","调查","ˈsɜːrveɪ"],["temporary","临时的","ˈtempəreri"],["transaction","交易","trænˈzækʃən"],["transfer","转移；调动","trænsˈfɜːr"],["transportation","交通运输","ˌtrænspərˈteɪʃən"],["update","更新","ʌpˈdeɪt"],["vacancy","职位空缺","ˈveɪkənsi"],["valid","有效的","ˈvælɪd"],["venue","场地","ˈvenjuː"],["verify","核实","ˈverɪfaɪ"],["warranty","保修","ˈwɔːrənti"],["warehouse","仓库","ˈwerhaʊs"],["workshop","研讨会；车间","ˈwɜːrkʃɑːp"]];const key='toeic-v1-day1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const root=document.getElementById('list');function stats(){const a=Object.values(saved);document.getElementById('stats').textContent='已标记 '+a.length+'/100 · 很熟悉 '+a.filter(x=>x===2).length+' · 有点熟悉 '+a.filter(x=>x===1).length+' · 不认识 '+a.filter(x=>x===0).length}function speak(w,slow){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音合成');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=slow?.7:1;speechSynthesis.speak(u)}words.forEach(([w,zh,ipa],i)=>{const a=document.createElement('article');const title=document.createElement('div');title.className='row';const s=document.createElement('strong');s.textContent=(i+1)+'. '+w;title.append(s);for(const [label,slow] of [['🔊 播放',false],['🐢 慢速',true]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>speak(w,slow);title.append(b)}a.append(title);const desc=document.createElement('p');desc.textContent='/'+ipa+'/ · '+zh;a.append(desc);const row=document.createElement('div');row.className='row';[ ['很熟悉',2],['有点熟悉',1],['完全不认识',0] ].forEach(([label,val])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',saved[i]===val);b.onclick=()=>{saved[i]=val;try{localStorage.setItem(key,JSON.stringify(saved))}catch{}row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',false));b.setAttribute('aria-pressed',true);stats()};row.append(b)});a.append(row);root.append(a)});stats();</script></html>
