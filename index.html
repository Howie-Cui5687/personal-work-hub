<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1f694c" />
  <title>个人工作台</title>
  <style>
    :root{--ink:#18231e;--muted:#7e8881;--line:#e5e8e2;--paper:#f8f9f5;--mint:#dbefe2;--green:#1f694c;--lime:#d8f24d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}main{min-height:100vh;display:flex}.sidebar{width:250px;padding:34px 20px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#fbfcf9}.brand{font:700 22px Georgia,serif;display:flex;align-items:center;gap:10px;padding:0 11px 42px}.brand-mark{font:30px Arial;color:var(--green);transform:rotate(-20deg)}nav{display:grid;gap:4px}button{font:inherit}nav button{border:0;background:transparent;color:#536058;border-radius:9px;text-align:left;padding:11px;cursor:pointer;display:flex;gap:12px;align-items:center}nav button:hover,nav button.active{background:#e5f3e8;color:#184e3b}.nav-label{font-size:11px;letter-spacing:1px;color:#a0a8a1;margin:29px 11px 6px}.user{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0;display:flex;align-items:center;gap:10px;font-size:13px}.avatar{background:#d2e6d2;border-radius:50%;width:31px;height:31px;text-align:center;padding-top:7px;color:#30533c}.user div{display:grid}.user small{color:var(--muted);font-size:11px}.content{padding:58px clamp(28px,5vw,82px);max-width:1440px;flex:1}header,.panel-title,.progress-row{display:flex;justify-content:space-between;align-items:center}.eyebrow{color:#829087;font-size:11px;letter-spacing:.7px;text-transform:uppercase;margin:0 0 8px}h1{font:700 clamp(29px,3vw,43px) Georgia,serif;margin:0;letter-spacing:-1px}h2{font-size:19px;margin:0}.primary{background:#1f694c;color:#fff;border:0;border-radius:8px;padding:12px 17px;cursor:pointer;box-shadow:0 5px 12px #1f694c26}.focus{margin:42px 0 30px;padding:25px 29px;background:var(--mint);border-radius:13px;display:flex;align-items:center;gap:20px}.sun{width:42px;height:42px;background:var(--lime);border-radius:50%;display:grid;place-items:center;font-size:25px}.focus p{font-size:12px;color:#49755d;margin:0 0 5px}.focus h2{font-size:17px}.focus span{font-size:13px;color:#64806f}.focus button{margin-left:auto;border:0;background:transparent;color:#42725a;cursor:pointer}.grid{display:grid;grid-template-columns:minmax(420px,1.35fr) minmax(310px,.8fr);gap:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:26px}.panel-title{align-items:flex-start}.count{color:#758078;background:#f2f4f0;border-radius:20px;font-size:11px;padding:6px 9px}.tabs{border-bottom:1px solid var(--line);margin-top:22px;display:flex;gap:20px}.tabs button{border:0;background:none;padding:0 0 11px;color:#8d978f;font-size:13px;cursor:pointer}.tabs .selected{color:var(--green);border-bottom:2px solid var(--green)}.task{display:flex;align-items:center;padding:17px 2px;border-bottom:1px solid #edf0eb;gap:13px}.check{width:19px;height:19px;border-radius:50%;border:1.5px solid #bac5bc;background:#fff;color:#fff;cursor:pointer;flex:none}.task.done .check{background:var(--green);border-color:var(--green)}.task.done h3{text-decoration:line-through;color:#a1aaa3}.task-copy{flex:1}.task h3{margin:0 0 5px;font-size:14px;font-weight:500}.task p{margin:0;color:#89938c;font-size:11px}.dot{width:6px;height:6px;display:inline-block;border-radius:50%;background:#84aef5;margin-right:5px}.task i{font-style:normal;margin:0 6px;color:#b8bfb9}.tag{border-radius:20px;padding:5px 8px;font-size:10px;background:#f1f2ed;color:#657067}.tag.focus-tag{background:#fdf0df;color:#ad6d21}.tag.chat-tag{background:#e5effe;color:#4573a9}.tag.plan-tag{background:#eee8f9;color:#70599a}.add-task,.link{background:none;border:0;color:var(--green);font-size:13px;cursor:pointer}.add-task{padding:18px 0 0}.rightcol{display:grid;gap:24px}.progress-row{justify-content:flex-start;gap:18px;margin:20px 0}.ring{width:75px;height:75px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1deg),#eaf0e9 0);display:grid;place-items:center}.ring:before{content:"";grid-area:1/1;width:59px;height:59px;background:#fff;border-radius:50%}.ring span{grid-area:1/1;z-index:1;font-size:14px}.progress-row h2{font:600 27px Georgia,serif}.progress-row p{margin:2px 0;color:var(--muted);font-size:12px}.streak{display:flex;gap:11px;align-items:center;background:#f7f9f5;border-radius:8px;padding:10px}.streak div{display:grid}.streak strong{font-size:12px}.streak small{font-size:10px;color:var(--muted)}.notes{margin-top:20px;display:grid;gap:20px}.notes article{display:grid;grid-template-columns:43px 12px 1fr;gap:7px}.notes time{font-size:10px;color:#a0aaa1;padding-top:3px}.line{width:9px;height:9px;border:2px solid #6b9a7d;border-radius:50%;margin-top:4px;background:#fff}.notes h3{margin:0 0 4px;font-size:13px;font-weight:500}.notes p{margin:0;color:#8b958d;font-size:11px}.modal-bg{position:fixed;inset:0;background:#15201766;display:grid;place-items:center;padding:20px}.composer{background:#fff;width:min(490px,100%);padding:31px;border-radius:16px;position:relative;box-shadow:0 15px 50px #192b1d33}.close{position:absolute;right:17px;top:13px;border:0;background:none;font-size:24px;color:#78827b;cursor:pointer}.composer h2{font:600 24px Georgia,serif;margin-bottom:20px}.composer textarea,.composer input{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;font:14px inherit}.composer textarea{min-height:130px;resize:vertical;margin-bottom:15px}.composer label{display:grid;gap:7px;margin:12px 0;font-size:13px}.hint{color:var(--muted);font-size:12px;line-height:1.7}@media(max-width:840px){.sidebar{display:none}.content{padding:32px 18px}.grid{grid-template-columns:1fr}.focus{margin-top:28px}header{gap:14px}.focus{padding:20px}.focus h2{font-size:15px}}@media(max-width:480px){header .primary{padding:10px;font-size:12px}.focus .sun,.focus button{display:none}.panel{padding:20px}.task .tag{display:none}}
  </style>
</head>
<body>
  <main><aside class="sidebar"><div class="brand"><span class="brand-mark">◒</span><span>afterglow</span></div><nav><button class="active">◉　今日</button><button>▦　全部</button><button>✓　已完成</button><p class="nav-label">工作区</p><button>◌　产品迭代</button><button>◌　用户研究</button><button>◌　品牌升级</button></nav><div class="user"><div class="avatar">W</div><div><strong>我的空间</strong><small>本机保存</small></div></div></aside><section class="content"><header><div><p class="eyebrow" id="date"></p><h1>让今天，留下痕迹。</h1></div><button class="primary" id="quick">+ 快速记录</button></header><section class="focus"><div class="sun">☼</div><div><p>今日聚焦</p><h2>完成项目周报，明确下周的推进节奏。</h2><span>给重要的事留出完整的 90 分钟。</span></div></section><div class="grid"><section class="panel tasks"><div class="panel-title"><div><p class="eyebrow">待办事项</p><h2>今天要做什么？</h2></div><span class="count" id="remaining"></span></div><div class="tabs"><button class="selected">按优先级</button><button>按项目</button></div><div class="task-list" id="tasks"></div><button class="add-task" id="addTask">+ 添加任务</button></section><section class="rightcol"><div class="panel progress"><p class="eyebrow">今日进度</p><div class="progress-row"><div class="ring" id="ring" style="--p:0"><span id="percent">0%</span></div><div><h2 id="done">0 / 0</h2><p>已完成事项</p></div></div><div class="streak"><span>✦</span><div><strong>数据保存在本机浏览器</strong><small>同一浏览器再次打开会自动保留</small></div></div></div><div class="panel timeline"><div class="panel-title"><div><p class="eyebrow">工作记录</p><h2>今天发生了什么？</h2></div><button class="link" id="record">+ 记录</button></div><div class="notes" id="notes"></div></div></section></div></section></main><div class="modal-bg" id="modal" hidden><div class="composer"><button class="close" id="close">×</button><p class="eyebrow">快速记录</p><h2>捕捉刚刚发生的事</h2><textarea id="noteText" placeholder="例如：和团队确认了发布节奏…"></textarea><button class="primary" id="saveNote">保存记录</button><p class="hint">提示：GitHub Pages 静态版不提供在线账户或多人同步；任务和记录会保存在当前设备的浏览器中。</p></div></div><script>
    const defaultTasks=[{title:'完成项目周报初稿',project:'产品迭代',due:'今天 17:00',tag:'深度工作',done:false},{title:'梳理客户访谈要点',project:'用户研究',due:'明天',tag:'沟通',done:false},{title:'归档设计评审结论',project:'品牌升级',due:'本周五',tag:'整理',done:false},{title:'更新路线图优先级',project:'产品迭代',due:'本周',tag:'规划',done:true}];
    let tasks=JSON.parse(localStorage.getItem('workHubTasks')||'null')||defaultTasks;let notes=JSON.parse(localStorage.getItem('workHubNotes')||'null')||[{time:'10:40',title:'记录了访谈中的三个关键阻碍',meta:'用户研究 · 会议纪要'},{time:'09:15',title:'确定周报结构与数据口径',meta:'产品迭代 · 工作记录'}];
    const save=()=>{localStorage.setItem('workHubTasks',JSON.stringify(tasks));localStorage.setItem('workHubNotes',JSON.stringify(notes))};
    const tagClass=t=>t==='深度工作'?'focus-tag':t==='沟通'?'chat-tag':t==='规划'?'plan-tag':'';
    function render(){const done=tasks.filter(t=>t.done).length,p=tasks.length?Math.round(done/tasks.length*100):0;document.querySelector('#tasks').innerHTML=tasks.map((t,i)=>`<article class="task ${t.done?'done':''}"><button class="check" data-i="${i}">${t.done?'✓':''}</button><div class="task-copy"><h3>${t.title}</h3><p><span class="dot"></span>${t.project}<i>·</i>${t.due}</p></div><span class="tag ${tagClass(t.tag)}">${t.tag}</span></article>`).join('');document.querySelector('#remaining').textContent=`${tasks.length-done} 项待完成`;document.querySelector('#done').textContent=`${done} / ${tasks.length}`;document.querySelector('#percent').textContent=`${p}%`;document.querySelector('#ring').style.setProperty('--p',p);document.querySelector('#notes').innerHTML=notes.map(n=>`<article><time>${n.time}</time><span class="line"></span><div><h3>${n.title}</h3><p>${n.meta}</p></div></article>`).join('');document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{tasks[b.dataset.i].done=!tasks[b.dataset.i].done;save();render()})}
    const now=new Date();document.querySelector('#date').textContent=`${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()]} · ${now.getMonth()+1} 月 ${now.getDate()} 日`;
    const modal=document.querySelector('#modal');const open=()=>{modal.hidden=false;document.querySelector('#noteText').focus()};document.querySelector('#quick').onclick=open;document.querySelector('#record').onclick=open;document.querySelector('#close').onclick=()=>modal.hidden=true;modal.onclick=e=>{if(e.target===modal)modal.hidden=true};document.querySelector('#saveNote').onclick=()=>{const text=document.querySelector('#noteText').value.trim();if(!text)return;notes.unshift({time:'刚刚',title:text,meta:'快速记录 · 收件箱'});save();render();modal.hidden=true;document.querySelector('#noteText').value=''};document.querySelector('#addTask').onclick=()=>{const title=prompt('输入待办事项：');if(title?.trim()){tasks.push({title:title.trim(),project:'收件箱',due:'待安排',tag:'整理',done:false});save();render()}};render();
  </script>
</body>
</html>

<style>.modal-bg[hidden]{display:none}</style>
